services:
  # Host budget (8GB machine): total container caps = 6.25g, leaving ~1.75g
  # for macOS + Docker daemon. See docs/INDEX.md "Host Sizing".
  # Concurrency + child memory limits are sourced from app/config.py defaults;
  # override via INGEST_* env vars (never hard-code them here again).
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    mem_limit: 256m         # broker + result backend (small queues)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - INGEST_REDIS_URL=redis://redis:6379/0
    volumes:
      - ingestion_data:/data   # shared with workers: API streams uploads here
    ports: ["8000:8000"]
    mem_limit: 512m         # FastAPI is I/O bound; uploads stream to disk, not RAM
    depends_on:
      redis: {condition: service_healthy}

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --queues=ingestion --concurrency=${INGEST_INGESTION_CONCURRENCY:-2} --max-tasks-per-child=${INGEST_WORKER_MAX_TASKS_PER_CHILD:-20}
    environment:
      - INGEST_REDIS_URL=redis://redis:6379/0
      - INGEST_WORKER_CHILD_MEMORY_LIMIT_MB=${INGEST_WORKER_CHILD_MEMORY_LIMIT_MB:-1024}
      - INGEST_WORKER_MEMORY_BUDGET_MB=${INGEST_WORKER_MEMORY_BUDGET_MB:-2048}
    mem_limit: 2g           # 2 children x 1GB child limit; page-streamed parsing keeps RSS low
    volumes:
      - ingestion_data:/data
    depends_on:
      redis: {condition: service_healthy}

  media-worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --queues=media --concurrency=${INGEST_MEDIA_CONCURRENCY:-2} --max-tasks-per-child=${INGEST_MEDIA_MAX_TASKS_PER_CHILD:-10}
    environment:
      - INGEST_REDIS_URL=redis://redis:6379/0
      - INGEST_WHISPER_MODEL_SIZE=tiny
      - INGEST_WORKER_CHILD_MEMORY_LIMIT_MB=${INGEST_MEDIA_CHILD_MEMORY_LIMIT_MB:-384}   # child must fit inside the 1g cap
    mem_limit: 1g           # 2 children; whisper tiny int8 (~200MB each) + 512px frame buffers
    volumes:
      - ingestion_data:/data
    depends_on:
      redis: {condition: service_healthy}

  index-worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --queues=index --concurrency=${INGEST_INDEX_CONCURRENCY:-1}
    environment:
      - INGEST_REDIS_URL=redis://redis:6379/0
      - INGEST_QDRANT_URL=http://qdrant:6333
      - INGEST_WORKER_CHILD_MEMORY_LIMIT_MB=${INGEST_INDEX_CHILD_MEMORY_LIMIT_MB:-768}   # single child fits the 1g cap
    mem_limit: 1g           # 1 child; MiniLM ~90MB; Qdrant offloads vector math
    volumes:
      - ingestion_data:/data
    depends_on:
      redis: {condition: service_healthy}

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    mem_limit: 1g           # dedicated vector DB; distance math stays off the workers
    volumes:
      - qdrant_storage:/qdrant/storage

  reasoning-worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --queues=reasoning --concurrency=${INGEST_REASONING_CONCURRENCY:-1}
    environment:
      - INGEST_REDIS_URL=redis://redis:6379/0
      - INGEST_REASONING_BACKEND=${INGEST_REASONING_BACKEND:-auto}
      - INGEST_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - INGEST_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - INGEST_WORKER_CHILD_MEMORY_LIMIT_MB=${INGEST_REASONING_CHILD_MEMORY_LIMIT_MB:-512}  # child must fit the 512m cap
    mem_limit: 512m         # cloud I/O bound; local GGUF opt-in must NOT run on this host
    volumes:
      - ingestion_data:/data
    depends_on:
      redis: {condition: service_healthy}

volumes:
  qdrant_storage:
  ingestion_data:
