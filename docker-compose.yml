version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      - INGEST_REDIS_URL=redis://redis:6379/0
    ports: ["8000:8000"]
    mem_limit: 1g          # sized for an 8GB host (API stays lightweight)
    depends_on:
      redis: {condition: service_healthy}

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --queues=ingestion --concurrency=4
    environment:
      - INGEST_REDIS_URL=redis://redis:6379/0
    mem_limit: 4g          # 4 children x 1GB child limit = worker budget (~50% of 8GB host RAM)
    depends_on:
      redis: {condition: service_healthy}

  media-worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --queues=media --concurrency=2 --max-tasks-per-child=10
    environment:
      - INGEST_REDIS_URL=redis://redis:6379/0
      - INGEST_WHISPER_MODEL_SIZE=tiny
    mem_limit: 3g          # Phase 2 vision/audio models; modest footprint on the 8GB host
    depends_on:
      redis: {condition: service_healthy}

  index-worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --queues=index --concurrency=2
    environment:
      - INGEST_REDIS_URL=redis://redis:6379/0
      - INGEST_QDRANT_URL=http://qdrant:6333
    mem_limit: 2g          # MiniLM embedding is lightweight; 2 children on the 8GB host
    depends_on:
      redis: {condition: service_healthy}

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes:
      - qdrant_storage:/qdrant/storage

  reasoning-worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --queues=reasoning --concurrency=1
    environment:
      - INGEST_REDIS_URL=redis://redis:6379/0
      - INGEST_REASONING_BACKEND=${INGEST_REASONING_BACKEND:-auto}
      - INGEST_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - INGEST_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    mem_limit: 1g          # reasoning is I/O bound (cloud) or opt-in local GGUF
    depends_on:
      redis: {condition: service_healthy}

volumes:
  qdrant_storage:
